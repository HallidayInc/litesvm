name: build-litesvm-deno

on: [push, workflow_dispatch]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          override: true

      - uses: actions-rs/cargo@v1
        with:
          use-cross: true
          command: build
          args: --target ${{ matrix.target }} --release -p litesvm-deno

      - name: Place artifact
        run: |
          for f in target/${{ matrix.target }}/release/liblitesvm_deno*.{dylib,so}; do
            [ -e "$f" ] && cp "$f" "crates/deno-litesvm/litesvm_deno.${{ matrix.target }}.${f##*.}" && break
          done

      - uses: actions/upload-artifact@v4
        with:
          name: prebuild-${{ matrix.target }}
          path: crates/deno-litesvm/litesvm_deno.${{ matrix.target }}.*
          retention-days: 1

  pack:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: prebuild-*
          path: crates/deno-litesvm
          merge-multiple: true

      - name: Package artifacts
        run: |
          crate_version=$(grep '^version' Cargo.toml | head -n1 | cut -d '"' -f2)
          tar czf litesvm-deno-$crate_version.tgz crates/deno-litesvm/ts/ crates/deno-litesvm/litesvm_deno.*

      - uses: actions/upload-artifact@v4
        with:
          name: litesvm-deno
          path: litesvm-deno-*.tgz
